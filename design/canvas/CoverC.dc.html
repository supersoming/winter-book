<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Black+Han+Sans&family=Syne:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    a { color: #2B2540; } a:hover { color: #BFCBFF; }
  </style>
</helmet>
<div style="position: relative; width: 710px; height: 971px; background: #FFFFFF; color: #2B2540; overflow: hidden; box-sizing: border-box; padding: 44px 48px; display: flex; flex-direction: column; gap: 0;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 3px solid #2B2540; font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 13px; letter-spacing: 0.3em; font-weight: 800;">
    <div>DELTA PHYSICS</div>
    <div>2022 개정</div>
    <div>WINTER</div>
  </div>

  <div style="position: relative; height: 470px; margin-top: 28px;">
    <div style="position: absolute; left: 30px; top: 0; width: 560px; height: 470px; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); background: linear-gradient(180deg, #FFB5C2 0%, #FFCFB0 18%, #FFF1B5 34%, #C6F0D6 50%, #B5E6F7 66%, #BFCBFF 82%, #DABDFF 100%);"></div>
    <div style="position: absolute; left: 30px; top: 0; width: 560px; height: 470px; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); background: linear-gradient(90deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.45) 50%, rgba(43,37,64,0.06) 100%);"></div>
    <div style="position: absolute; right: 0; top: 0; width: 150px; display: flex; flex-direction: column; gap: 6px; text-align: right;">
      <div style="font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 11px; letter-spacing: 0.24em; font-weight: 800;">SPECTRUM</div>
      <div style="font-size: 12px; line-height: 1.6; color: #444;">분홍에서 라일락까지. 파장이 짧을수록 더 많이 꺾인다.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 22px;">
    <div style="font-family: 'Black Han Sans', 'IBM Plex Sans KR', sans-serif; font-size: 92px; line-height: 0.95; letter-spacing: -0.01em; color: #2B2540;">델타 물리학</div>
    <div style="font-size: 17px; font-weight: 500; line-height: 1.5;">빛은 한 줄기로 들어와 일곱 갈래로 나간다. 개념도 그렇게 갈라져야 보인다.</div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 4px solid #FFB5C2;">
        <div style="font-family: 'Syne', sans-serif; font-size: 11px; letter-spacing: 0.16em; font-weight: 800;">Δ01–08</div>
        <div style="font-size: 15px; font-weight: 700;">힘과 에너지</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 4px solid #C6F0D6;">
        <div style="font-family: 'Syne', sans-serif; font-size: 11px; letter-spacing: 0.16em; font-weight: 800;">Δ09–12</div>
        <div style="font-size: 15px; font-weight: 700;">전기와 자기</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 4px solid #DABDFF;">
        <div style="font-family: 'Syne', sans-serif; font-size: 11px; letter-spacing: 0.16em; font-weight: 800;">Δ13–15</div>
        <div style="font-size: 15px; font-weight: 700;">빛과 물질</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 3px solid #2B2540; font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 12px; letter-spacing: 0.2em; font-weight: 700;">
      <div>예비고1 · 예비고2</div>
      <div>15 UNITS / 10 WEEKS</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

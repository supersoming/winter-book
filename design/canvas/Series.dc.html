<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    a { color: #2B2540; } a:hover { color: #BFCBFF; }
  </style>
</helmet>
<div style="width: 1000px; height: 600px; background: #FFFFFF; color: #2B2540; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 20px; font-weight: 700;">시리즈 확장 규칙 — 책장에 꽂으면 무지개가 된다</div>
    <div style="font-size: 14px; line-height: 1.6; color: #555;">프리즘과 구도는 고정, 갈라져 나오는 빛의 색 구간만 바뀐다. 겨울은 라일락–하늘, 봄은 민트–레몬, 여름은 피치–분홍. 세 권의 책등을 나란히 두면 전체 스펙트럼이 완성된다.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; height: 330px;">
    <div style="position: relative; background: radial-gradient(ellipse 90% 60% at 70% 45%, #2A2650 0%, #0F1128 70%); color: #fff; box-sizing: border-box; padding: 18px; overflow: hidden;">
      <svg viewBox="0 0 300 330" width="100%" height="100%" style="position: absolute; inset: 0;" aria-hidden="true">
        <g opacity="0.95"><polygon points="170,160 300,110 300,134" fill="#DABDFF"></polygon><polygon points="170,160 300,140 300,164" fill="#CBC3FF"></polygon><polygon points="170,160 300,170 300,194" fill="#BFCBFF"></polygon><polygon points="170,160 300,200 300,224" fill="#B5E6F7"></polygon></g>
        <polygon points="0,150 110,160 0,166" fill="#ffffff" opacity="0.9"></polygon>
        <polygon points="150,80 235,240 65,240" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="2"></polygon>
      </svg>
      <div style="position: relative; display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; font-size: 9px; letter-spacing: 0.24em; font-weight: 700;"><div>DELTA PHYSICS</div><div>WINTER</div></div>
      <div style="position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 20px; font-weight: 700;">델타 물리학</div><div style="font-size: 10px; color: #B9C4E6;">겨울 · 라일락–하늘</div></div>
    </div>
    <div style="position: relative; background: radial-gradient(ellipse 90% 60% at 70% 45%, #1F3A2E 0%, #0C1A14 70%); color: #fff; box-sizing: border-box; padding: 18px; overflow: hidden;">
      <svg viewBox="0 0 300 330" width="100%" height="100%" style="position: absolute; inset: 0;" aria-hidden="true">
        <g opacity="0.95"><polygon points="170,160 300,110 300,134" fill="#B5E6F7"></polygon><polygon points="170,160 300,140 300,164" fill="#C6F0D6"></polygon><polygon points="170,160 300,170 300,194" fill="#A8DDA0"></polygon><polygon points="170,160 300,200 300,224" fill="#FFF1B5"></polygon></g>
        <polygon points="0,150 110,160 0,166" fill="#ffffff" opacity="0.9"></polygon>
        <polygon points="150,80 235,240 65,240" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="2"></polygon>
      </svg>
      <div style="position: relative; display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; font-size: 9px; letter-spacing: 0.24em; font-weight: 700;"><div>DELTA PHYSICS</div><div>SPRING</div></div>
      <div style="position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 20px; font-weight: 700;">델타 물리학</div><div style="font-size: 10px; color: #BFE3C9;">봄 · 민트–레몬 [범위 추후 결정]</div></div>
    </div>
    <div style="position: relative; background: radial-gradient(ellipse 90% 60% at 70% 45%, #3D2431 0%, #1A0E14 70%); color: #fff; box-sizing: border-box; padding: 18px; overflow: hidden;">
      <svg viewBox="0 0 300 330" width="100%" height="100%" style="position: absolute; inset: 0;" aria-hidden="true">
        <g opacity="0.95"><polygon points="170,160 300,110 300,134" fill="#FFF1B5"></polygon><polygon points="170,160 300,140 300,164" fill="#FFCFB0"></polygon><polygon points="170,160 300,170 300,194" fill="#E07A95"></polygon><polygon points="170,160 300,200 300,224" fill="#FFB5C2"></polygon></g>
        <polygon points="0,150 110,160 0,166" fill="#ffffff" opacity="0.9"></polygon>
        <polygon points="150,80 235,240 65,240" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="2"></polygon>
      </svg>
      <div style="position: relative; display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; font-size: 9px; letter-spacing: 0.24em; font-weight: 700;"><div>DELTA PHYSICS</div><div>SUMMER</div></div>
      <div style="position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 20px; font-weight: 700;">델타 물리학</div><div style="font-size: 10px; color: #F3CDB8;">여름 · 피치–분홍 [범위 추후 결정]</div></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; font-weight: 600; color: #555;">책등 3권 나란히</div>
    <div style="display: flex; height: 44px;">
      <div style="flex: 1; background: linear-gradient(90deg, #DABDFF, #BFCBFF, #B5E6F7); display: flex; align-items: center; padding: 0 14px; color: #fff; font-family: 'Syne', sans-serif; font-size: 10px; letter-spacing: 0.2em; font-weight: 700;">WINTER</div>
      <div style="flex: 1; background: linear-gradient(90deg, #B5E6F7, #C6F0D6, #FFF1B5); display: flex; align-items: center; padding: 0 14px; color: #2B2540; font-family: 'Syne', sans-serif; font-size: 10px; letter-spacing: 0.2em; font-weight: 700;">SPRING</div>
      <div style="flex: 1; background: linear-gradient(90deg, #FFF1B5, #FFCFB0, #FFB5C2); display: flex; align-items: center; padding: 0 14px; color: #2B2540; font-family: 'Syne', sans-serif; font-size: 10px; letter-spacing: 0.2em; font-weight: 700;">SUMMER</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

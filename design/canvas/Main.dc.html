<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    a { color: #ffffff; } a:hover { color: #FFD600; }
  </style>
</helmet>
<div style="position: relative; width: 710px; height: 971px; background: radial-gradient(ellipse 90% 60% at 70% 45%, #16204A 0%, #070B18 60%, #03050D 100%); color: #FFFFFF; overflow: hidden; box-sizing: border-box; padding: 52px;">

  <svg viewBox="0 0 710 971" width="710" height="971" style="position: absolute; left: 0; top: 0; display: block;" aria-hidden="true">
    <defs>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"></stop>
        <stop offset="0.5" stop-color="#9BB7FF" stop-opacity="0.08"></stop>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"></stop>
      </linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
      </linearGradient>
    </defs>

    <g filter="url(#glow)" opacity="0.85">
      <polygon points="418,455 710,300 710,372" fill="#8B5CF6"></polygon>
      <polygon points="418,455 710,360 710,432" fill="#2563EB"></polygon>
      <polygon points="418,455 710,420 710,492" fill="#06B6D4"></polygon>
      <polygon points="418,455 710,480 710,552" fill="#22C55E"></polygon>
      <polygon points="418,455 710,540 710,612" fill="#FFD600"></polygon>
      <polygon points="418,455 710,600 710,672" fill="#FF8A00"></polygon>
      <polygon points="418,455 710,660 710,732" fill="#FF3B3B"></polygon>
    </g>
    <g opacity="0.95">
      <polygon points="418,455 710,318 710,366" fill="#8B5CF6"></polygon>
      <polygon points="418,455 710,378 710,426" fill="#2563EB"></polygon>
      <polygon points="418,455 710,438 710,486" fill="#06B6D4"></polygon>
      <polygon points="418,455 710,498 710,546" fill="#22C55E"></polygon>
      <polygon points="418,455 710,558 710,606" fill="#FFD600"></polygon>
      <polygon points="418,455 710,618 710,666" fill="#FF8A00"></polygon>
      <polygon points="418,455 710,678 710,726" fill="#FF3B3B"></polygon>
    </g>

    <polygon points="0,372 250,438 0,452" fill="url(#beam)" filter="url(#soft)"></polygon>
    <polygon points="0,398 250,438 0,428" fill="#FFFFFF" opacity="0.9"></polygon>

    <polygon points="355,220 560,590 150,590" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3" stroke-linejoin="miter"></polygon>
    <polygon points="355,220 560,590 150,590" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="16" filter="url(#soft)"></polygon>
    <line x1="355" y1="220" x2="150" y2="590" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"></line>
  </svg>

  <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 13px; letter-spacing: 0.3em; font-weight: 700; color: #FFFFFF;">DELTA PHYSICS</div>
      <div style="font-size: 14px; font-weight: 500; color: #B9C4E6;">2022 개정 교육과정 물리학</div>
    </div>
    <div style="font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 13px; letter-spacing: 0.3em; font-weight: 700; color: #FFFFFF;">WINTER</div>
  </div>

  <div style="position: absolute; left: 52px; right: 52px; bottom: 52px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; gap: 16px;">
        <div style="font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 118px; line-height: 0.85; font-weight: 800; background: linear-gradient(90deg, #8B5CF6 0%, #2563EB 18%, #06B6D4 36%, #22C55E 52%, #FFD600 68%, #FF8A00 84%, #FF3B3B 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">Δ</div>
        <div style="font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: #FFFFFF;">델타 물리학</div>
      </div>
      <div style="font-size: 18px; font-weight: 400; line-height: 1.5; color: #D7DEF5;">하나의 빛이 프리즘을 지나면 일곱 색이 된다. 이번 겨울, 당신의 변화량.</div>
    </div>
    <div style="height: 3px; background: linear-gradient(90deg, #8B5CF6, #2563EB, #06B6D4, #22C55E, #FFD600, #FF8A00, #FF3B3B);"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Syne', 'IBM Plex Sans KR', sans-serif; font-size: 12px; letter-spacing: 0.2em; font-weight: 500; color: #B9C4E6;">
      <div>예비고1 · 예비고2</div>
      <div>15 UNITS / 10 WEEKS</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

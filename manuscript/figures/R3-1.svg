<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="빛과 물질 연결도: 파동 → 입자 → hf = ΔE, 그리고 c 불변" style="max-width:100%;height:auto;display:block;color:#443E5C"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 Z" fill="currentColor"/></marker></defs><rect x="20.0" y="40.0" width="120.0" height="50.0" fill="#FFF1B5" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="80.0" y="57.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ12</text><text x="80.0" y="74.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">간섭 = 파동, 굴절·렌즈</text><rect x="190.0" y="40.0" width="120.0" height="50.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="250.0" y="57.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ13</text><text x="250.0" y="74.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">광전 효과 = 입자, λ = h/mv</text><rect x="360.0" y="40.0" width="130.0" height="50.0" fill="#C6F0D6" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="425.0" y="57.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ14</text><text x="425.0" y="74.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">준위·띠틈 → 광자</text><rect x="190.0" y="160.0" width="120.0" height="50.0" fill="#DABDFF" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="250.0" y="177.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ15</text><text x="250.0" y="194.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">c 불변 → 시간·길이</text><line x1="140.0" y1="65.0" x2="188.0" y2="65.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="164.0" y="53.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">이중성</text><line x1="310.0" y1="65.0" x2="358.0" y2="65.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="334.0" y="53.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">E = hf</text><line x1="60.0" y1="90.0" x2="220.0" y2="158.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#ah)" opacity="1"/><text x="110.0" y="140.0" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">빛의 속력 c</text><text x="280.0" y="240.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:600" opacity="1">밝기는 광자 수, 진동수는 광자 하나의 에너지</text></svg>
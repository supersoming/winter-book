<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="힘과 에너지 개념 연결도: 그래프에서 F = ma를 거쳐 보존 법칙으로" style="max-width:100%;height:auto;display:block;color:#443E5C"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 Z" fill="currentColor"/></marker></defs><rect x="20.0" y="20.0" width="110.0" height="44.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="75.0" y="34.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ00 · Δ01</text><text x="75.0" y="51.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">벡터, 그래프, Δ</text><rect x="170.0" y="20.0" width="110.0" height="44.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="225.0" y="34.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ02</text><text x="225.0" y="51.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">등가속도, v–t 넓이</text><rect x="225.0" y="120.0" width="110.0" height="50.0" fill="#FFF1B5" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="280.0" y="137.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ03  F = ma</text><text x="280.0" y="154.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">힘은 속도를 바꾼다</text><rect x="20.0" y="220.0" width="120.0" height="44.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="80.0" y="234.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ04</text><text x="80.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">계 나누기, 빗면, 마찰</text><rect x="170.0" y="220.0" width="110.0" height="44.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="225.0" y="234.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ05</text><text x="225.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">ΣF = 0, Στ = 0</text><rect x="320.0" y="220.0" width="110.0" height="44.0" fill="#FFB5C2" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="375.0" y="234.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ06</text><text x="375.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">FΔt = Δp</text><rect x="430.0" y="120.0" width="110.0" height="50.0" fill="#DABDFF" stroke="none" stroke-width="1.6" rx="4" opacity="0.85"/><text x="485.0" y="137.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:700" opacity="1">Δ07</text><text x="485.0" y="154.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="0.85">Fs = ΔK, 에너지 보존</text><line x1="130.0" y1="42.0" x2="168.0" y2="42.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="149.0" y="30.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">a = Δv/Δt</text><line x1="225.0" y1="64.0" x2="265.0" y2="118.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="228.0" y="96.0" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">a 에 F 를 붙임</text><line x1="255.0" y1="170.0" x2="100.0" y2="218.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><line x1="270.0" y1="170.0" x2="232.0" y2="218.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><line x1="300.0" y1="170.0" x2="360.0" y2="218.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><line x1="335.0" y1="145.0" x2="428.0" y2="145.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="382.0" y="133.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">× 거리</text><text x="400.0" y="200.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:400" opacity="1">× 시간 → Δ06</text><text x="280.0" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:600" opacity="1">시간이 나오면 공식 · 힘이 나오면 F = ma · 처음과 나중만 있으면 보존</text></svg>
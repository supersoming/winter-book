<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-label="수소 원자 에너지 준위와 n=2로 떨어지는 전이가 내는 가시광선" style="max-width:100%;height:auto;display:block;color:#443E5C"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 Z" fill="currentColor"/></marker></defs><line x1="60.0" y1="225.0" x2="60.0" y2="30.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah)" opacity="1"/><text x="60.0" y="18.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:400" opacity="1">E (eV)</text><line x1="80.0" y1="220.0" x2="260.0" y2="220.0" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="275.0" y="220.0" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="1">n = 1   -13.6 eV</text><line x1="80.0" y1="125.0" x2="260.0" y2="125.0" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="275.0" y="125.0" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="1">n = 2   -3.4 eV</text><line x1="80.0" y1="93.3" x2="260.0" y2="93.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="275.0" y="93.3" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="1">n = 3   -1.51 eV</text><line x1="80.0" y1="77.5" x2="260.0" y2="77.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="275.0" y="77.5" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="1">n = 4   -0.85 eV</text><line x1="80.0" y1="30.0" x2="260.0" y2="30.0" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.6"/><text x="275.0" y="30.0" text-anchor="start" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="0.7">n = ∞   0 (이온화)</text><line x1="120.0" y1="93.3" x2="120.0" y2="125.0" stroke="#E05A5A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)" opacity="1" style="color:#E05A5A"/><text x="120.0" y="139.0" text-anchor="middle" dominant-baseline="middle" fill="#E05A5A" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:600" opacity="1">3→2 빨강 656 nm</text><line x1="200.0" y1="77.5" x2="200.0" y2="125.0" stroke="#3FA7C9" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)" opacity="1" style="color:#3FA7C9"/><text x="200.0" y="153.0" text-anchor="middle" dominant-baseline="middle" fill="#3FA7C9" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:9px;font-weight:600" opacity="1">4→2 청록 486 nm</text><text x="170.0" y="242.0" text-anchor="middle" dominant-baseline="middle" fill="currentColor" style="font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-size:10px;font-weight:400" opacity="0.8">준위 간격은 위로 갈수록 좁아진다 (눈금은 비례가 아님)</text></svg>